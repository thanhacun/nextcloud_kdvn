user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10G; # Matches Nextcloud upload limits

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types application/atom+xml application/javascript application/json application/ld+json application/manifest+json application/rss+xml application/vnd.geo+json application/vnd.ms-fontobject application/x-font-ttf application/x-web-app-manifest+json application/xhtml+xml application/xml font/opentype image/bmp image/svg+xml image/x-icon text/cache-manifest text/css text/plain text/vcard text/vnd.rim.location.xloc text/vtt text/x-component text/x-cross-domain-policy;

    upstream php-handler {
        server nextcloud-app-fpm:9000; # Must match your FPM container name
    }

    server {
        listen 80;
        server_name ://kinden.com.vn;
        root /var/www/html;
        index index.php index.html;

        # Add headers to serve security related headers
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Correctly pass headers from HAProxy
        fastcgi_param HTTPS on;
        
        location = /robots.txt {
            allow all;
            log_not_found off;
            access_log off;
        }

        # Handling .well-known for Dav/Caldav
        location ^~ /.well-known {
            location = /.well-known/carddav { return 301 /remote.php/dav/; }
            location = /.well-known/caldav  { return 301 /remote.php/dav/; }
            location /.well-known/acme-challenge    { try_files $uri $uri/ =404; }
            location /.well-known/pki-validation     { try_files $uri $uri/ =404; }
            return 301 /index.php$request_uri;
        }

        # Root Nextcloud Location
        location / {
            rewrite ^ /index.php;
        }

        # --- Collabora Office Support ---
        location ^~ /browser {
            proxy_pass http://collabora:9980;
            proxy_set_header Host $host;
        }
        location ^~ /hosting/discovery {
            proxy_pass http://collabora:9980;
            proxy_set_header Host $host;
        }
        location ^~ /cool {
            proxy_pass http://collabora:9980;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade; # Required for WebSockets
            proxy_set_header Connection "upgrade";
        }

        # --- Notify-Push (High Performance Backend) ---
        location ^~ /push/ {
            proxy_pass http://notify:7867/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }

        # --- Harp (App API) Support ---
        location ^~ /exapps/ {
            proxy_pass http://harp:8780;
            proxy_set_header Host $host;
        }

        # PHP Processing for FPM
        location ~ ^\/(?:index|remote|public|cron|core\/ajax\/update|status|ocs\/v|updater\/.+|ocm-provider\/.+)\.php(?:$|\/) {
            fastcgi_split_path_info ^(.+?\.php)(\/.*)$;
            set $path_info $fastcgi_path_info;
            try_files $fastcgi_script_name =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $path_info;
            fastcgi_param modHeadersAvailable true;
            fastcgi_param front_controller_active true;
            fastcgi_pass php-handler;
            fastcgi_intercept_errors on;
            fastcgi_request_buffering off;
        }

        # Cache static assets
        location ~* \.(?:css|js|woff2?|svg|gif|map)$ {
            try_files $uri /index.php$request_uri;
            add_header Cache-Control "public, max-age=15778463";
            access_log off;
        }

        location ~* \.(?:png|html|ttf|ico|jpg|jpeg|bcmap|mp4|webm)$ {
            try_files $uri /index.php$request_uri;
            access_log off;
        }
    }
}
