# Client-side Samba settings for libsmbclient (Nextcloud external storage, SMB/CIFS).
# Mounted read-only into nextcloud-app by docker-compose.override.yml.
# Replaces the Debian default /etc/samba/smb.conf, which only holds server settings.
[global]
   workgroup = WORKGROUP
   # After the NC 34 image rebuild (Samba 4.22) mounts failed with
   # "Bad SMB2 (sign_algo_id=2) signature": AES-GMAC signing. Do not offer GMAC.
   client smb3 signing algorithms = AES-128-CMAC HMAC-SHA256
